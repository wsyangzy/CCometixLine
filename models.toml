# Built-in model catalog, embedded into the executable at compile time.
# Edit this file, then run cargo test and cargo build --release.
# Runtime overrides: ~/.claude/ccline/models.toml (same entry format).
# First match wins. model_id matching accepts dated/named suffixes but will
# never match another numeric version (fable-5 must not match fable-5-2).
# Omit match_mode for the original substring matching used by user overrides.
# Context limits retain the existing defaults; [1m] always selects 1,000,000.

[[models]]
pattern = "claude-sonnet-4-6"
aliases = ["sonnet-4-6", "claude-4-6-sonnet"]
match_mode = "model_id"
display_name = "Sonnet 4.6"
context_limit = 200000

